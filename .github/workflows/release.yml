name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.4.0)
        required: true
        type: string
      notes:
        description: Human-curated release notes
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
