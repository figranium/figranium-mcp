name: Publish MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    name: Publish registry metadata
    runs-on: ubuntu-latest
    environment: mcp-registry-publish

    steps:
      - uses: actions/checkout@v7

      - name: Set manifest version from package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          jq --arg version "$VERSION"             '.version = $version | .packages |= map(if .registryType == "npm" and .identifier == "figranium-mcp" then .version = $version else . end)'             server.json > server.tmp
          mv server.tmp server.json

      - name: Install MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Validate registry manifest
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        env:
          MCP_GITHUB_TOKEN: ${{ secrets.MCP_GITHUB_TOKEN }}
        run: ./mcp-publisher login github --token "$MCP_GITHUB_TOKEN"

      - name: Publish registry metadata
        run: ./mcp-publisher publish
