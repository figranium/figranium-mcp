name: Release v1.3.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.3.3.yml

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Create release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.3             --repo "$GITHUB_REPOSITORY"             --target 20ebed257b902a8065374fc1b2c6d6cf93d3e9ac             --title 'v1.3.3'             --notes $'### Workflow boundary validation\n\n- Rejects Timed Wait and Navigate To as the first action block.\n- Rejects Get Content as the final action block.\n- Explains the task-level alternatives directly to agents.'

      - run: npm publish --access public --provenance

      - name: Publish MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Remove one-time release workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-v1.3.3.yml
          git commit -m 'chore: remove v1.3.3 release workflow'
          git push origin HEAD:main
