name: Sync v0.21 MCP lockfile once (SDK v0.7)

on:
  push:
    branches: [feat/v021-cookie-state-tasks]
    paths: ['.github/workflows/sync-v021-lock-once.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Update lockfile and validate
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm test
          npm run build
      - name: Commit lockfile and remove trigger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/sync-v021-lock-once.yml
          git commit -m 'chore: synchronize MCP v1.5.0 dependencies'
          git push origin HEAD:feat/v021-cookie-state-tasks
