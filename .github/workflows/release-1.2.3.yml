name: One-shot release v1.2.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-1.2.3.yml'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Apply task design guidance
        shell: bash
        env:
          SYSTEM_B64: 
          GUIDANCE_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os, re
          p = Path('src/mcp-server.ts')
          s = p.read_text()
          new_system = base64.b64decode(os.environ['SYSTEM_B64']).decode()
          s, n = re.subn(r"const SYSTEM_INSTRUCTIONS = `.*?\n`;", lambda m: new_system, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace SYSTEM_INSTRUCTIONS')
          replacements = {
              "Variable name to store output data or extracted content in. Expected type: string. Example: 'extractedTitle'": "Runtime variable name used by actions such as Set Variable, merge, or foreach. Set Variable may create or update this runtime variable. Do not use varName as the schema for final task outputs; use extractionScript for final extraction.",
              "Configures state variables accessible throughout the task execution.": "Configures task input variables and caller-overridable values. Do not declare output-only fields here; use Set Variable for mid-task runtime state and extractionScript for final outputs.",
              "Task variables to store state and dynamic values. Expected type: record object of variable configurations.": "Task INPUT variables and caller-overridable configuration only. Do not declare output-only fields or transient runtime state here. Use Set Variable for mid-task state. Expected type: record object of variable configurations.",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('Missing expected schema text: ' + old[:50])
              s = s.replace(old, new)
          old_extract = "Optional post-execution script to extract data. Expected type: string. Example: 'return Array.from(document.querySelectorAll(\\\"a\\\")).map(el => el.href)'"
          new_extract = "Post-execution extraction script for the task's actual final output. Final structured fields, lists, tables, parsing, and extraction logic belong here rather than in task variables or JavaScript action blocks. Expected type: string. Example: 'return Array.from(document.querySelectorAll(\\\"a\\\")).map(el => el.href)'"
          if old_extract in s:
              s = s.replace(old_extract, new_extract)
          s = re.sub(r'\n  "variables": \{\n    "hn_stories": \{\n      "type": "string",\n      "value": "\[\]"\n    \}\n  \},', '\n  "variables": {},', s, count=1)
          p.write_text(s)
          spec = Path('AGENT_SPEC.md')
          a = spec.read_text()
          if '## Task design and extraction rules' not in a:
              spec.write_text(a.rstrip() + base64.b64decode(os.environ['GUIDANCE_B64']).decode() + '\n')
          PY

      - name: Bump package version
        run: npm version 1.2.3 --no-git-tag-version

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Commit release changes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/release-1.2.3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: v1.2.3 task design guidance"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag -a v1.2.3 -m "v1.2.3"
          git push origin v1.2.3

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.3 --title "v1.2.3" --notes $'### Agent task design guidance\n\n- Treat task variables as inputs/configuration rather than output fields.\n- Use Set Variable for runtime state; it can create or update variables.\n- Require final structured extraction and table parsing in Extraction Script.\n- Prefer native Figranium actions over unnecessary JavaScript and duplicate blocks.\n- Verify actual task results after execution instead of trusting status alone.\n- Prefer direct/reliable sources, structured list output, and deduplication where appropriate.\n- Keep execution-time values dynamic and preserve reasonable user intent ambiguity.'
