name: One-time MCP v1.5.0 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.5.0-once.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - run: |
          npm ci
          npm run build
          npm test
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag v1.5.0 HEAD
          git push origin v1.5.0
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          # v1.5.0

          - Added optional reusable cookie-state attachment to MCP task creation and updates for Figranium v0.21.
          - Updated the underlying JavaScript SDK to the automation-focused v0.7 line.
          - Restored runtime validation of Task updates and deletions.
          - Kept workspace-only credential and settings administration outside the MCP API.
          EOF
          gh release create v1.5.0 --title v1.5.0 --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - name: Cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-v1.5.0-once.yml
          git commit -m 'ci: remove completed MCP v1.5.0 release trigger'
          git pull --rebase origin main
          git push origin HEAD:main
