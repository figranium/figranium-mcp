name: Refresh SDK lockfile
on:
  push:
    paths:
      - .github/workflows/refresh-sdk-lock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Regenerate lockfile and verify build
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
          npm test
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: regenerate lockfile for @figranium/sdk 0.4.0"
          git push origin HEAD:main
